[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "browserstealthmcp"
dynamic = ["version"]
description = "Ultimate undetectable browser automation MCP server with CDP-level access"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vibhek Soni", email = "vibheksoni@engineer.com"},
]

# Runtime dependencies
dependencies = [
    "fastmcp==2.11.2",
    "mcp==1.30.0",
    "nodriver==0.47.0",
    "pydantic==2.12.5",
    "python-dotenv==1.1.1",
    "py2js==1.2.1",
    "jsbeautifier==1.15.4",
    "strinpy==0.0.4",
    "strbuilder==1.1.3",
    "psutil==7.0.0",
    "pillow==11.3.0",
    "requests==2.33.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
stealth-browser-mcp = "stealth_browser_mcp.server:main"
browserstealthmcp = "stealth_browser_mcp.server:main"

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

# Repository metadata
[project.urls]
Homepage = "https://github.com/vibheksoni/stealth-browser-mcp"
Documentation = "https://github.com/vibheksoni/stealth-browser-mcp#readme"
Repository = "https://github.com/vibheksoni/stealth-browser-mcp.git"
Issues = "https://github.com/vibheksoni/stealth-browser-mcp/issues"

[tool.hatch.version]
path = "src/stealth_browser_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stealth_browser_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "requirements.txt"]

# Code formatting
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
